[project]
name = "inilint"
version = "0.1.0"
description = "Command-line linter for INI files with precise line and column error messages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ljones82" }]

[project.scripts]
inilint = "inilint:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["inilint"]
